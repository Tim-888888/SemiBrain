name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: python -m pip install uv==0.12.0
      - run: uv sync --frozen --all-packages
      - run: uv run --all-packages ruff check packages services tests scripts
      - run: uv run --all-packages pytest -q
      - run: uv run --all-packages python scripts/verify/engineering.py
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
