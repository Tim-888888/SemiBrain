[project]
name = "semibrain-sandbox-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "matplotlib>=3.10,<4", "pillow>=11,<13"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semibrain_sandbox_runtime"]
