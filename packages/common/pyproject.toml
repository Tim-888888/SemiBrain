[project]
name = "semibrain-common"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "semibrain-contracts",
    "fastapi>=0.115",
    "pydantic-settings>=2.9",
    "httpx>=0.28",
    "pymongo>=4.14",
    "redis>=5.2,<7",
    "celery>=5.5,<6",
    "langfuse==4.15.4",
]
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/semibrain_common"]
[tool.uv.sources]
semibrain-contracts = { workspace = true }
