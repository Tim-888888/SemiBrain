name: semibrain-platform
x-api: &api
  image: ${BACKEND_IMAGE:?Build and pin backend image}
  restart: unless-stopped
  read_only: true
  tmpfs: ['/tmp:size=512m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [core]
  mem_limit: 1g
  environment:
    SEMIBRAIN_STAGE: knowledge-platform
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 6
services:
  conversation:
    <<: *api
    command: [uvicorn, semibrain_conversation.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log, --no-proxy-headers]
    env_file: ["${SECRET_DIR}/conversation.env"]
  agent:
    <<: *api
    command: [uvicorn, semibrain_agent.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    env_file: ["${SECRET_DIR}/agent.env"]
  business:
    <<: *api
    command: [uvicorn, semibrain_business.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    env_file: ["${SECRET_DIR}/business.env"]
    networks: [core, business-data]
    mem_limit: 2g
  conversation-worker:
    <<: *api
    command: [celery, -A, semibrain_conversation.worker:app, worker, --beat, --schedule, /tmp/celerybeat, --pool, threads, --concurrency, '2', --loglevel, WARNING, --without-gossip, --without-mingle, --without-heartbeat]
    env_file: ["${SECRET_DIR}/conversation.env"]
    healthcheck: {disable: true}
  agent-worker:
    <<: *api
    command: [celery, -A, semibrain_agent.worker:app, worker, --beat, --schedule, /tmp/celerybeat, --pool, threads, --concurrency, '3', --loglevel, WARNING, --without-gossip, --without-mingle, --without-heartbeat]
    env_file: ["${SECRET_DIR}/agent.env"]
    healthcheck: {disable: true}
  business-worker:
    <<: *api
    command: [celery, -A, semibrain_business.worker:app, worker, --beat, --schedule, /tmp/celerybeat, --pool, threads, --concurrency, '3', --loglevel, WARNING, --without-gossip, --without-mingle, --without-heartbeat]
    env_file: ["${SECRET_DIR}/business.env"]
    networks: [core, business-data]
    mem_limit: 3g
    healthcheck: {disable: true}
  bootstrap:
    image: ${BACKEND_IMAGE}
    profiles: [ops]
    command: [python, scripts/bootstrap/platform.py]
    env_file: ["${SECRET_DIR}/bootstrap.env"]
    networks: [core, business-data]
    read_only: true
    tmpfs: ['/tmp:size=256m,mode=1777']
  web:
    image: ${WEB_IMAGE:?Build and pin web image}
    ports: ['127.0.0.1:8081:8080']
    volumes: ['../proxy/platform.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [core]
    restart: unless-stopped
    mem_limit: 256m
networks:
  core: {}
  business-data: {internal: true}
