# Private TLS verification by default. Bind public ports only after domain filing.
services:
  domain:
    image: ${WEB_IMAGE:?Pin the web image}
    profiles: [domain]
    ports: ['127.0.0.1:8443:443', '127.0.0.1:8082:80']
    volumes:
      - ../proxy/domain.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:?Set private certificate directory}/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_DIR}/semibrain.key:/etc/nginx/tls/semibrain.key:ro
    networks: [core]
    restart: unless-stopped
    mem_limit: 128m
