# Include inside the Langfuse HTTPS server. Requires core Docker networking.
# Replace the return origin below if SemiBrain uses another canonical domain.
set $sso_upstream http://conversation:8000;
location = /semibrain/sso {
    access_log off;
    proxy_pass $sso_upstream/v1/auth/langfuse/bridge$is_args$args;
    proxy_set_header X-Service-Identity '';
    proxy_set_header X-Service-Token '';
}
location = /semibrain/logout {
    access_log off;
    proxy_pass $sso_upstream/v1/auth/langfuse/bridge?action=logout&$args;
    proxy_set_header X-Service-Identity '';
    proxy_set_header X-Service-Token '';
}
location = /semibrain/signed-out {
    return 303 https://semibrain.net.cn/;
}
location = /api/auth/callback/custom {
    access_log off;
    proxy_pass $langfuse_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}
