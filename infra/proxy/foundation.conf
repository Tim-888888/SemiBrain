server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / { try_files $uri $uri/ /index.html; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location = /foundation-health/conversation { proxy_pass http://conversation:8000/healthz; }
    location = /foundation-health/agent { proxy_pass http://agent:8000/healthz; }
    location = /foundation-health/business { proxy_pass http://business:8000/healthz; }
    location /internal/ { return 404; }
    location /api/ { return 503; }
}
