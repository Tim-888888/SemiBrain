server {
    listen 8080;
    server_name semibrain.net.cn www.semibrain.net.cn localhost;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $conversation_upstream http://conversation:8000;
    client_max_body_size 34m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /internal/ { return 404; }
    location /v1/ {
        proxy_pass $conversation_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Service-Identity '';
        proxy_set_header X-Service-Token '';
        proxy_buffering off;
        proxy_read_timeout 240s;
    }
    location /admin/v1/ {
        proxy_pass $conversation_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Service-Identity '';
        proxy_set_header X-Service-Token '';
        proxy_read_timeout 240s;
    }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
