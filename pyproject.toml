[project]
name = "semibrain-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.12", "httpx>=0.28", "reportlab>=4.4", "openpyxl>=3.1", "python-pptx>=1.0", "pip-licenses>=5.0"]

[tool.uv.workspace]
members = ["packages/contracts", "packages/common", "services/*", "vendor/weknora-docreader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires explicitly configured private dependencies"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
