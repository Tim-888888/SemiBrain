[project]
name = "weknora-docreader-subset"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.13.4", "pillow>=12.2", "numpy>=2.2", "python-docx>=1.2", "markitdown[docx,pdf]>=0.1.3", "pypdf>=6.13.3", "pypdfium2>=5.8.0", "lxml>=6.1"]
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/docreader"]
